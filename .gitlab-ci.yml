stages:
  - lint
  - test
  - build
  - publish

include:
  - component: $CI_SERVER_FQDN/components/dependency-scanning/main@1.1.1

variables:
  NODE_VERSION: '24'

default:
  image: node:${NODE_VERSION}
  cache:
    - key: 
        files:
          - elm.json
      paths:
        - ~/.elm/
    - key:
        files:
          - package.json
      paths:
        - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline --ignore-scripts
    - npx elm make --optimize --output=/dev/null src/Curtissimo/SplitPane.elm 

lint:
  stage: lint
  script:
    - npm run lint:format

static-analysis:
  stage: lint
  script:
    - npm run lint:review

verify-examples:
  stage: test
  script:
    - npm run test:docs

build-npm-package:
  stage: build
  script:
    - npm run build:assets
  artifacts:
    paths:
      - build/

build-pages:
  stage: build
  script:
    - npm run build:examples
  artifacts:
    paths:
      - public/

pages:
  stage: publish
  dependencies:
    - build-pages
  artifacts:
    paths:
      - public/
  rules:
    - if: $CI_COMMIT_TAG

publish-npm-package:
  stage: publish
  dependencies:
    - build-npm-package
  environment:
    name: production
    url: https://www.npmjs.com/package/@curtissimo/elm-split-pane
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - npm publish --provenance --access public
  rules:
    - if: $CI_COMMIT_TAG

publish-elm-package:
  stage: publish
  dependencies: []
  environment:
    name: production
    url: https://package.elm-lang.org/packages/curtissimo/elm-split-pane/latest/
  script:
    - npx elm publish
  rules:
    - if: $CI_COMMIT_TAG